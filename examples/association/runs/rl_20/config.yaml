name: rl_20
flow_matching_path: runs/flow_matching
surrogate_path: runs/surrogate
deployment: random/20
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0
  b1: 0.9
  b2: 0.999
  grad_clip: 1.0
train:
  n_steps: 300
  seed: 42
  ckpt_freq: 50
  eval:
    freq: 10
    seed: 42
    n_steps: 32
    n_samples: 128
    n_repeats: 5
    top_ks:
    - 1
    - 8
    - 32
    - 128
  rollout:
    n_contexts: 256
    n_groups: 32
    group_size: 16
    n_sim_repeats: 1
    chunk_size: 128
    sim_chunk_size: 4096
    gen_steps: 6
    dtype: float32
  nft:
    beta: 1.0
    adv_clip: 5.0
    kl_coef: 0.0001
    eta_rate: 0.001
    eta_max: 0.5
    minibatch_size: 128
    accumulation: 4
    dtype: float32
  surrogate:
    n_epochs: 4
    learning_rate: 0.0003
