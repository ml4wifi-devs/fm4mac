defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
name: autoencoder
dataset_path: datasets
model:
  embed_features: 64
  encoder_features: [128, 64]
  decoder_features: [64, 128]
  latent_features: 32
  n_layers: 3
  dtype: float64
optimizer:
  learning_rate: 5.0e-05
  weight_decay: 0.01
  b1: 0.95
  b2: 0.95
  grad_clip: 1.0
train:
  n_steps: 3000
  batch_size: 128
  loss_weights: [1, 1, 1, 1, 1, 1]
  # The KL term is summed over the 32 latent features (0.01 of the mean)
  kl_weight: 0.01
  val_batches: 10
  val_freq: 100
  log_freq: 50
  ckpt_freq: 500
  seed: 42
hydra:
  output_subdir: null
  run:
    dir: .
