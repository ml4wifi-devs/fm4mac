defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
name: surrogate
dataset_path: datasets
model:
  gnn_layers: 3
  dim: 64
  ff_dim: 128
  n_layers: 3
  n_heads: 4
  drop_rate: 0.2
  dtype: float32
  embed_nodes: false
optimizer:
  learning_rate: 0.0015
  weight_decay: 0.01
  b1: 0.85
  b2: 0.999
  grad_clip: 1.0
train:
  n_steps: 20000
  group_size: 10
  rank_weight: 1.0
  log_freq: 100
  val_freq: 1000
  ckpt_freq: 5000
  seed: 42
hydra:
  output_subdir: null
  run:
    dir: .
