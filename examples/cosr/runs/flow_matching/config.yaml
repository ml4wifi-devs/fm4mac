name: flow_matching
autoencoder_path: runs/autoencoder
train_paths:
  - datasets/h_mab.pkl.lz4
  - datasets/f_optimal.pkl.lz4
  - datasets/t_optimal.pkl.lz4
val_paths:
  - datasets/h_mab_val.pkl.lz4
  - datasets/f_optimal_val.pkl.lz4
  - datasets/t_optimal_val.pkl.lz4
encoded_path: datasets/fm_train.pkl.lz4
encoded_val_path: datasets/fm_val.pkl.lz4
model:
  gnn_layers: 3
  dim: 72
  ff_dim: 144
  n_layers: 2
  n_heads: 4
  drop_rate: 0.1
  embed_features: 32
  dtype: float64
optimizer:
  learning_rate: 0.001
  weight_decay: 0.01
  b1: 0.95
  b2: 0.95
  grad_clip: 1.0
  ema_decay: 0.999
train:
  n_steps: 5000
  batch_size: 32
  val_steps: 10
  val_freq: 100
  mmd_samples: 5
  log_freq: 20
  ckpt_freq: 500
  seed: 42
