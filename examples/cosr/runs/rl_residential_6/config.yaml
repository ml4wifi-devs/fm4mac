name: flow_matching
autoencoder_path: runs/autoencoder
train_paths:
- datasets/h_mab.pkl.lz4
- datasets/f_optimal.pkl.lz4
- datasets/t_optimal.pkl.lz4
val_paths:
- datasets/h_mab_val.pkl.lz4
- datasets/f_optimal_val.pkl.lz4
- datasets/t_optimal_val.pkl.lz4
encoded_path: datasets/fm_train.pkl.lz4
encoded_val_path: datasets/fm_val.pkl.lz4
model:
  gnn_layers: 3
  dim: 72
  ff_dim: 144
  n_layers: 2
  n_heads: 4
  drop_rate: 0.1
  embed_features: 32
  dtype: float64
optimizer:
  learning_rate: 0.001
  weight_decay: 0.01
  b1: 0.95
  b2: 0.95
  grad_clip: 1.0
  ema_decay: 0.999
train:
  n_steps: 5000
  batch_size: 32
  val_steps: 10
  val_freq: 100
  mmd_samples: 5
  log_freq: 20
  ckpt_freq: 500
  seed: 42
surrogate:
  model:
    gnn_layers: 3
    dim: 64
    ff_dim: 128
    n_layers: 3
    n_heads: 4
    drop_rate: 0.1
    dtype: float32
rl:
  name: rl_residential_6
  scenario: residential/6
  flow_matching_path: runs/flow_matching
  surrogate_path: runs/surrogate
  optimizer:
    learning_rate: 0.0001
    weight_decay: 0.0
    grad_clip: 1.0
  train:
    n_steps: 300
    n_designated: 6
    ckpt_freq: 50
    seed: 42
    rollout:
      n_contexts: 256
      n_groups: 32
      group_size: 16
      n_sim_repeats: 1
      gen_steps: 6
      chunk_size: 64
      sim_chunk_size: 2048
    nft:
      beta: 1.0
      adv_clip: 5.0
      kl_coef: 0.0001
      eta_rate: 0.001
      eta_max: 0.5
      n_epochs: 1
      minibatch_size: 32
    surrogate:
      n_epochs: 4
      learning_rate: 0.0003
      rank_weight: 1.0
  eval:
    freq: 10
    seed: 42
    n_contexts: 32
    n_samples: 128
    n_repeats: 5
    top_ks:
    - 1
    - 8
    - 32
    - 128
    coverage_ratio: 1.0
    candidates: fm
    scores: surrogate
    refine: true
    refine_freq: 50
    refine_top_k: 8
    n_rounds: 2
    refine_seed: 0
    refine_batch_size: 128
