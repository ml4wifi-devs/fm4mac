name: autoencoder
train_paths:
  - datasets/random.pkl.lz4
  - datasets/h_mab.pkl.lz4
  - datasets/f_optimal.pkl.lz4
  - datasets/t_optimal.pkl.lz4
val_paths:
  - datasets/random_val.pkl.lz4
  - datasets/h_mab_val.pkl.lz4
  - datasets/f_optimal_val.pkl.lz4
  - datasets/t_optimal_val.pkl.lz4
model:
  embed_features: 64
  encoder_features: [128, 64]
  decoder_features: [64, 128]
  latent_features: 32
  n_layers: 3
  dtype: float64
optimizer:
  learning_rate: 0.00005
  weight_decay: 0.01
  b1: 0.95
  b2: 0.95
  grad_clip: 1.0
train:
  n_steps: 3000
  batch_size: 128
  loss_weights: [1, 1, 1, 1, 1, 1, 1]
  kl_weight: 0.01
  val_steps: 10
  val_freq: 100
  log_freq: 50
  ckpt_freq: 500
  seed: 42
