defaults:
  - _self_
  - rl_preset: null
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none
name: rl_residential_3
scenario: residential/3
flow_matching_path: runs/flow_matching
surrogate_path: runs/surrogate
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 1.0
train:
  n_steps: 300
  n_designated: 3
  ckpt_freq: 50
  seed: 42
  rollout:
    n_contexts: 256
    n_groups: 32
    group_size: 16
    n_sim_repeats: 1
    gen_steps: 6
    chunk_size: 64
    sim_chunk_size: 2048
  nft:
    beta: 1.0
    adv_clip: 5.0
    kl_coef: 0.0001
    eta_rate: 0.001
    eta_max: 0.5
    n_epochs: 1
    minibatch_size: 32
  surrogate:
    n_epochs: 4
    learning_rate: 0.0003
    rank_weight: 1.0
eval:
  freq: 10
  seed: 42
  n_contexts: 32
  n_samples: 128
  n_repeats: 5
  top_ks: [1, 8, 32, 128]
  coverage_ratio: 1.0
  candidates: fm
  scores: surrogate
  refine: true
  refine_freq: null
  refine_top_k: 8
  n_rounds: 2
  refine_seed: 0
  refine_batch_size: 128
hydra:
  output_subdir: null
  run:
    dir: .
