name: flow_matching
autoencoder_path: runs/autoencoder
dataset: datasets/pf_train_*.pkl.lz4
val_dataset: datasets/pf_val_*.pkl.lz4
model:
  gnn_layers: 3
  dim: 72
  ff_dim: 144
  n_layers: 2
  n_heads: 4
  drop_rate: 0.1
  embed_features: 32
  dtype: float32
optimizer:
  learning_rate: 0.001
  weight_decay: 0.01
  b1: 0.95
  b2: 0.95
  grad_clip: 1.0
train:
  n_steps: 5000
  max_edges: 4096
  n_val_batches: 10
  ema_decay: 0.999
  seed: 42
  log_freq: 20
  val_freq: 100
  ckpt_freq: 500
