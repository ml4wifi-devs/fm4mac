name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra cosr --group dev
      - run: uv run ruff check fm4mac tests examples
      - run: uv run python -m unittest discover -s tests -t .
      - run: uv run python -m unittest discover -s examples -p "test_*.py" -t .
